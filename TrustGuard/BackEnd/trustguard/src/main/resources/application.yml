spring:
  application:
    name: trustguard
  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY}
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud_reports
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080
